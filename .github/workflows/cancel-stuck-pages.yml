name: Cancel stuck Pages deployment
on:
  push:
    paths: ['.github/workflows/cancel-stuck-pages.yml']
permissions:
  pages: write
  deployments: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -X POST -w '\nHTTP %{http_code}\n' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/deployments/fe2a9d2c0ef03466af582fee3e02d56a535d9e10/cancel
